[project]
name = "squint"
version = "0.1.0"
description = "Local screenshot privacy checker"
readme = "README.md"
authors = [
    { name = "Sarthak Narula", email = "messagetosarthak@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
    "requests>=2.34.2",
]

[project.scripts]
squint = "squint:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
